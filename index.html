<script>
    // 1. جلب اسم الصفحة تلقائياً
    const pageTitle = document.title || window.location.pathname;

    // 2. جلب اسم الدولة تلقائياً باللغة العربية عبر إعدادات المتصفح الإقليمية للمستخدم
    let userCountry = "العراق"; // القيمة الافتراضية
    try {
        const timeZone = Intl.DateTimeFormat().resolvedOptions().timeZone;
        if (timeZone) {
            // تحويل المناطق الزمنية إلى أسماء دول عربية واضحة ومباشرة
            if (timeZone.includes("Baghdad")) userCountry = "العراق";
            else if (timeZone.includes("Riyadh")) userCountry = "السعودية";
            else if (timeZone.includes("Cairo")) userCountry = "مصر";
            else if (timeZone.includes("Amman")) userCountry = "الأردن";
            else if (timeZone.includes("Damascus")) userCountry = "سوريا";
            else if (timeZone.includes("Kuwait")) userCountry = "الكويت";
            else if (timeZone.includes("Dubai") || timeZone.includes("Abu_Dhabi")) userCountry = "الإمارات";
            else if (timeZone.includes("Asia") || timeZone.includes("Middle_East")) userCountry = "العراق"; 
            else {
                // إذا كان الزائر أجنبي، نترجم اسم الدولة بناءً على رمز البلد
                const region = new Intl.Locale(navigator.language).region;
                if (region) {
                    const regionNames = new Intl.DisplayNames(['ar'], { type: 'region' });
                    userCountry = regionNames.of(region) || "العراق";
                }
            }
        }
    } catch (e) {
        userCountry = "العراق";
    }

    // دالة إرسال الإشارة مباشرة لملف PHP
    function sendPing(isPing = 0) {
        fetch('track.php', {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            // يتم إرسال اسم الصفحة واسم الدولة المجلوب هنا مباشرة للسيرفر
            body: `page=${encodeURIComponent(pageTitle)}&country=${encodeURIComponent(userCountry)}&ping=${isPing}`
        });
    }

    // إرسال الإشارة الأولى فور الدخول
    sendPing(0);

    // تحديث النشاط كل 15 ثانية للتأكد من حالة (نشط)
    let activityTimeout;
    function resetActivity() {
        clearTimeout(activityTimeout);
        activityTimeout = setTimeout(() => {
            sendPing(1); 
            resetActivity();
        }, 15000); 
    }

    window.addEventListener('mousemove', resetActivity);
    window.addEventListener('keypress', resetActivity);
    window.addEventListener('scroll', resetActivity);
    resetActivity();
</script>

<script>
  var form = document.getElementById('mainForm');
  var summary = document.getElementById('summary');
  var msg = document.getElementById('msg');
  var submitBtn = form.querySelector('.btn-primary');

  var rules = {
    name: function(v){
      v = v.trim();
      if(!v) return 'الاسم الكامل مطلوب.';
      if(v.length < 3) return 'الاسم قصير جداً، اكتب الاسم كاملاً.';
      if(!/^[\u0600-\u06FFa-zA-Z\s'-]+$/.test(v)) return 'الاسم يجب أن يحتوي على حروف فقط.';
      if(!/\s/.test(v.trim())) return 'اكتب الاسم كاملاً (الاسم الثلاثي أو ثنائي على الأقل).';
      return '';
    },
    phone: function(v){
      var t = v.trim().replace(/[\s\-().]/g, '');
      if(!t) return 'رقم الهاتف واتساب مطلوب.';
      if(t.indexOf('+964') === 0) t = '0' + t.slice(4);
      else if(t.indexOf('00964') === 0) t = '0' + t.slice(5);
      else if(t.indexOf('964') === 0) t = '0' + t.slice(3);
      if(!/^\d+$/.test(t)) return 'رقم الهاتف يجب أن يحتوي على أرقام فقط.';
      if(!/^07\d{9}$/.test(t)) return 'أدخل رقم واتساب صحيح يبدأ بـ 07 ويتكوّن من 11 رقم، مثال: 07XXXXXXXXX.';
      return '';
    },
    qi: function(v){ return v ? '' : 'اختر هل خدمات كي مفعّلة على جهازك.'; },
    amount: function(v){ return v ? '' : 'اختر مبلغ السلفة المطلوب.'; },
    salary: function(v){ return v ? '' : 'اختر الراتب الشهري.'; },
    job: function(v){ return v ? '' : 'اختر الوظيفه.'; }
  };

  function show(id, text){
    var input = document.getElementById(id);
    var field = input.closest('.field');
    var err = document.getElementById('err-' + id);
    if(text){
      field.classList.add('bad');
      input.setAttribute('aria-invalid', 'true');
      err.textContent = text;
      err.style.display = 'block';
    } else {
      field.classList.remove('bad');
      input.removeAttribute('aria-invalid');
      err.textContent = '';
      err.style.display = 'none';
    }
    return !text;
  }

  function validateField(id){
    var value = document.getElementById(id).value;
    return show(id, rules[id](value));
  }

  Object.keys(rules).forEach(function(id){
    var input = document.getElementById(id);
    var evt = input.tagName === 'SELECT' ? 'change' : 'input';
    input.addEventListener(evt, function(){
      if(input.closest('.field').classList.contains('bad')) validateField(id);
    });
    input.addEventListener('blur', function(){
      if(document.getElementById(id).value.trim() || input.closest('.field').classList.contains('bad')) validateField(id);
    });
  });

  form.addEventListener('submit', function(e){
    e.preventDefault();
    msg.style.display = 'none';
    var firstBad = null;
    Object.keys(rules).forEach(function(id){
      if(!validateField(id) && !firstBad) firstBad = id;
    });
    if(firstBad){
      summary.classList.add('show');
      document.getElementById(firstBad).focus();
      document.getElementById(firstBad).scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }
    summary.classList.remove('show');
    msg.style.display = 'block';
    submitBtn.disabled = true;
    
    // تم تفعيل السطر لإرسال البيانات إلى process.php ومن ثم التوجيه للصفحة التالية تلقائياً
    form.submit();
  });

  form.addEventListener('reset', function(){
    Object.keys(rules).forEach(function(id){ show(id, ''); });
    summary.classList.remove('show');
    msg.style.display = 'none';
    submitBtn.disabled = false;
  });
</script>
